<!doctype html>
<html lang="en" data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Template bootstrap Raquel</title>


    </head>
  <body>



  <div class="container">
      <div class="row">
          <div class="col-8 mx-auto">
              <div class="p-3 mb-2 bg-black text-light text-center fs-1 fw-normal">Series y peliculas populares</div>

              <div id="carouselExampleCaptions" data-bs-interval="3000" data-bs-ride="carousel" class="carousel slide carousel-fade">
                  <div class="carousel-indicators">
                      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
                      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
                  </div>
                  <div class="carousel-inner">
                      <div class="carousel-item active">
                          <img src="images/imagen1.jpg" class="d-block w-100" alt="Portada de Stranger things">
                          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50">
                              <h5>First slide label</h5>
                              <p>Stranger Things - "Friends don't lie" – Frase icónica de Eleven</p>
                          </div>
                      </div>
                      <div class="carousel-item">
                          <img src="images/imagen2.jpg" class="d-block w-100" alt="Portada de la casa de papel">
                          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50">
                              <h5>Second slide label</h5>
                              <p>La Casa de Papel - El profesor siempre tiene un plan.</p>
                          </div>
                      </div>
                      <div class="carousel-item">
                          <img src="images/imagen3.jpg" class="d-block w-100" alt="Portada de Breaking bad">
                          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50">
                              <h5>Third slide label</h5>
                              <p>Breaking Bad - De profesor de química a Heisenberg</p>
                          </div>
                      </div>
                  </div>
                  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Previous</span>
                  </button>
                  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                      <span class="carousel-control-next-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Next</span>
                  </button>
              </div>

          </div>
      </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  </body>

</html>
